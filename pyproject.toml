[project]
name = "iz2"
version = "0.1.0"
description = "IZ2: evidence-based analysis of Kazakhstan public procurement relationships"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2",
    "whitenoise>=6.9.0",
    "gunicorn>=23.0.0",
    "psycopg2-binary>=2.9.12",
    "celery>=5.4.0",
    "redis>=5.0.0",
    "django-celery-beat>=2.7.0",
    "beautifulsoup4>=4.12.0",
    "curl-cffi>=0.7.0",
    "requests>=2.32.0",
    "python-dotenv>=1.0.0",
    "colorama>=0.4.6",
    "django-fixture-magic>=0.1.5",
    "pydantic>=2.13.4",
    "djangorestframework>=3.17.2,<3.18",
    "drf-spectacular[sidecar]>=0.29,<0.30",
]

# Setuptools is the existing build backend; no application modules are packaged.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[dependency-groups]
dev = [
    "django-extensions>=3.2.0",
]
