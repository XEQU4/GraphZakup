# Preserve the existing volume namespace after a directory rename.
# New installations can set COMPOSE_PROJECT_NAME=iz2 in their private environment.
name: ${COMPOSE_PROJECT_NAME:-governmentprocurementgraph}

x-backend: &backend
  image: ${COMPOSE_PROJECT_NAME:-governmentprocurementgraph}-backend:local
  # Only migrate builds this tag; the other services reuse its local image.
  pull_policy: never
  environment: &backend-env
    DJANGO_LOAD_DOTENV: "false"
    GPG_LOG_TO_FILES: "false"
    SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in your env file}
    DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost},localhost,127.0.0.1
    CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
    TRUST_PROXY_SSL_HEADER: ${TRUST_PROXY_SSL_HEADER:-false}
    SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-false}
    SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-false}
    SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-0}
    SECURE_HSTS_INCLUDE_SUBDOMAINS: ${SECURE_HSTS_INCLUDE_SUBDOMAINS:-false}
    SECURE_HSTS_PRELOAD: ${SECURE_HSTS_PRELOAD:-false}
    # Explicit PG names prevent host .env from overriding the container DB host.
    PGDATABASE: ${DB_NAME:-suppliergraph}
    PGUSER: ${DB_USER:-suppliergraph}
    PGPASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your env file}
    PGHOST: db
    PGPORT: "5432"
    CELERY_BROKER_URL: redis://redis:6379/0
    ENABLE_SCHEDULED_IMPORT: ${ENABLE_SCHEDULED_IMPORT:-false}
    INGESTION_LEASE_SECONDS: ${INGESTION_LEASE_SECONDS:-900}
    INGESTION_SOURCE_CACHE_SECONDS: ${INGESTION_SOURCE_CACHE_SECONDS:-900}
    INGESTION_REQUEST_INTERVAL: ${INGESTION_REQUEST_INTERVAL:-1.5}
    OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    OPENROUTER_MODEL: ${OPENROUTER_MODEL:-qwen/qwen3-8b:free}
    AI_PROVIDER: ${AI_PROVIDER:-template}
    AI_MODEL: ${AI_MODEL:-}
    AI_MODEL_REVISION: ${AI_MODEL_REVISION:-}
    AI_BASE_URL: ${AI_BASE_URL:-}
    AI_OLLAMA_BASE_URL: http://ollama:11434
    AI_API_KEY: ${AI_API_KEY:-}
    AI_ALLOW_PAID: ${AI_ALLOW_PAID:-false}
    AI_EXPERIMENTAL_SCORING: ${AI_EXPERIMENTAL_SCORING:-false}
    AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-90}
    AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-1024}
    AI_MAX_INPUT_CHARS: ${AI_MAX_INPUT_CHARS:-8000}
    AI_MAX_FINDINGS: ${AI_MAX_FINDINGS:-12}
    AI_CONTEXT_TOKENS: ${AI_CONTEXT_TOKENS:-4096}
    GOSZAKUP_TOKEN: ${GOSZAKUP_TOKEN:-}
    ENABLE_KGD_CHECKS: ${ENABLE_KGD_CHECKS:-false}
    KGD_PORTAL_TOKEN: ${KGD_PORTAL_TOKEN:-}
    KGD_ACCOUNT_TOKENS_JSON: '${KGD_ACCOUNT_TOKENS_JSON:-}'
    KGD_TAXPAYER_TYPE: ${KGD_TAXPAYER_TYPE:-UL}
    KGD_HTTP_TIMEOUT: ${KGD_HTTP_TIMEOUT:-30}
    KGD_SOURCE_CACHE_SECONDS: ${KGD_SOURCE_CACHE_SECONDS:-900}
    KGD_RESULT_MAX_AGE_DAYS: ${KGD_RESULT_MAX_AGE_DAYS:-7}
    PORT: "8000"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-suppliergraph}
      POSTGRES_USER: ${DB_USER:-suppliergraph}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your env file}
    volumes:
      # New volume: PostgreSQL 16 files must never be opened directly with 17.
      - postgres17_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  migrate:
    <<: *backend
    build: .
    command: ["python", "manage.py", "migrate", "--noinput"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *backend
    restart: unless-stopped
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready/', timeout=5)"]
      interval: 10s
      timeout: 8s
      start_period: 20s
      retries: 6

  worker:
    <<: *backend
    restart: unless-stopped
    command: ["celery", "-A", "config", "worker", "--loglevel=info", "--concurrency=1", "--hostname=worker@%h"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
        required: false
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping --destination=worker@$$HOSTNAME --timeout=5"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  beat:
    <<: *backend
    restart: unless-stopped
    command: ["celery", "-A", "config", "beat", "--loglevel=info", "--scheduler=django_celery_beat.schedulers:DatabaseScheduler", "--pidfile=/tmp/celerybeat.pid"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      worker:
        condition: service_healthy

  # Explicit profile: downloads a free model; no cloud AI or source collection.
  ollama:
    image: ollama/ollama:0.40.0
    profiles: [local-ai]
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: "1"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      start_period: 15s
      retries: 20

  ollama-init:
    image: ollama/ollama:0.40.0
    profiles: [local-ai]
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_NO_CLOUD: "1"
    command: ["pull", "${OLLAMA_MODEL:-qwen3:4b}"]
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  postgres17_data:
  redis_data:
  ollama_models:
